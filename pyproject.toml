[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twogroup-linalg"
version = "0.1.0"
description = "Linear algebra utilities for finite two-groups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitgauss @ git+https://github.com/andibau13/bitgauss.git@6016bc93b134e8ce524f9501f429454181aff81e#subdirectory=pybindings",
    "numpy",
]
authors = [
    { name = "Andreas Bauer" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["twogroup_linalg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
